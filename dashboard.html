<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misti Software - Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f5f7; margin: 0; padding: 0; }
        
        /* Navbar (ઉપરની પટ્ટી) */
        .navbar { background-color: #ff4d4f; color: white; padding: 15px 20px; font-size: 18px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .logout-btn { font-size: 14px; background: rgba(255,255,255,0.2); padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        
        /* Cards (સફેદ બોક્સ) */
        .container { padding: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        
        /* Form Design */
        h3 { margin-top: 0; color: #333; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; font-size: 16px; }
        .form-row { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 15px; }
        .form-group { flex: 1; min-width: 150px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 13px; color: #666; font-weight: bold; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #d9d9d9; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #1890ff; }
        
        /* Buttons */
        .btn-save { background-color: #1890ff; color: white; border: none; padding: 10px 25px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .btn-save:hover { background-color: #007ae6; }
        .btn-export { background-color: #52c41a; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; float: right; font-weight: bold; }
        
        /* Table Design (નીચેનું લિસ્ટ) */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { border: 1px solid #e8e8e8; padding: 12px; text-align: left; }
        th { background-color: #fafafa; color: #333; font-weight: bold; }
        tr:hover { background-color: #f9f9f9; }
        .type-in { color: #52c41a; font-weight: bold; background: #f6ffed; padding: 2px 8px; border-radius: 4px; border: 1px solid #b7eb8f; }
        .type-out { color: #f5222d; font-weight: bold; background: #fff1f0; padding: 2px 8px; border-radius: 4px; border: 1px solid #ffa39e; }
        .action-icon { cursor: pointer; font-size: 16px; margin-right: 10px; }
    </style>
</head>
<body>

    <!-- ઉપરની લાલ પટ્ટી -->
    <div class="navbar">
        <span>Misti Software | દુકાન મેનેજમેન્ટ</span>
        <span class="logout-btn">Logout</span>
    </div>

    <div class="container">
        
        <!-- નવી એન્ટ્રી કરવાનું ફોર્મ -->
        <div class="card">
            <h3>નવી એન્ટ્રી કરો (Add Income/Expense)</h3>
            <div class="form-row">
                <div class="form-group">
                    <label>તારીખ (Date)</label>
                    <input type="date" id="entryDate">
                </div>
                <div class="form-group">
                    <label>પ્રકાર (Type)</label>
                    <select id="entryType">
                        <option value="in">આવક / ખરીદી (IN)</option>
                        <option value="out">જાવક / વેચાણ (OUT)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>માલની વિગત (Item Details)</label>
                    <input type="text" id="itemName" placeholder="દા.ત. શર્ટ, ચોખા, પેમેન્ટ...">
                </div>
                <div class="form-group">
                    <label>નંગ (Qty)</label>
                    <input type="number" id="itemQty" placeholder="0">
                </div>
                <div class="form-group">
                    <label>કિંમત (Amount ₹)</label>
                    <input type="number" id="itemAmount" placeholder="0.00">
                </div>
            </div>
            <!-- અત્યારે સેવ બટન દબાવવાથી ખાલી મેસેજ આવશે, ડેટાબેઝ પછી જોડીશું -->
            <button class="btn-save" onclick="alert('ભાઈ, હજુ આની પાછળ ડેટાબેઝ જોડવાનો બાકી છે!')">💾 Save Entry</button>
        </div>

        <!-- એક્સેલ ડાઉનલોડ બટન -->
        <div class="card" style="padding: 12px 20px; overflow: hidden; display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 14px; color: #666; font-weight: bold;">માલનો પૂરો હિસાબ (List of Entries)</span>
            <button class="btn-export">⬇️ Export to Excel</button>
        </div>

        <!-- નીચેનું લાઈવ ટેબલ -->
        <div class="card" style="overflow-x: auto;">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th style="width: 80px;">Action</th>
                        <th>તારીખ</th>
                        <th>પ્રકાર</th>
                        <th>માલની વિગત (Remarks)</th>
                        <th>નંગ</th>
                        <th>કિંમત (₹)</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- ડેમો ડેટા ૧: ખરીદી -->
                    <tr>
                        <td>
                            <span class="action-icon" title="Edit">✏️</span>
                            <span class="action-icon" title="Delete">🗑️</span>
                        </td>
                        <td>02-05-2026</td>
                        <td><span class="type-in">ખરીદી (IN)</span></td>
                        <td>નવા શર્ટનો માલ આવ્યો</td>
                        <td>50</td>
                        <td>25,000 ₹</td>
                    </tr>
                    <!-- ડેમો ડેટા ૨: વેચાણ -->
                    <tr>
                        <td>
                            <span class="action-icon" title="Edit">✏️</span>
                            <span class="action-icon" title="Delete">🗑️</span>
                        </td>
                        <td>02-05-2026</td>
                        <td><span class="type-out">વેચાણ (OUT)</span></td>
                        <td>ગ્રાહકને જીન્સ આપ્યા</td>
                        <td>2</td>
                        <td>1,200 ₹</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <script>
        // આજની તારીખ ઓટોમેટિક ફોર્મમાં સેટ કરવા માટે
        document.getElementById('entryDate').valueAsDate = new Date();
    </script>
</body>
</html>
